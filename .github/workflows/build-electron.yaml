name: Build Electron macOS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment name (dev or deploy)'
      version:
        required: true
        type: string
        description: 'Version string for the artifact name'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this is a prerelease build'

jobs:
  build-electron-macos:
    name: Build Electron macOS
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun add -g @quasar/cli

      - name: Init environment
        run: |
          cat <<EOT > .env.build
          DEBUG=${{ inputs.prerelease && 'true' || 'false' }}
          VITE_API_URL=${{ secrets.API_URL }}
          VITE_AUTH_URL=${{ secrets.AUTH_URL }}
          VITE_WS_URL=${{ secrets.WS_URL }}
          VITE_DEPLOYMENT_ENV=${{ inputs.environment }}
          EOT

      - name: Build Electron
        run: bunx env-cmd -f ./.env.build quasar build -m electron

      - name: Sign and create DMG
        run: |
          APP=$(find ./dist/electron -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP" ]; then echo "ERROR: .app bundle not found" && exit 1; fi

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Signed: $APP"

          STAGING=$(mktemp -d)
          ditto "$APP" "$STAGING/orgnote.app"
          xattr -rc "$STAGING"
          ln -s /Applications "$STAGING/Applications"

          mkdir -p ./dist/build
          hdiutil create \
            -volname "OrgNote" \
            -srcfolder "$STAGING" \
            -nospotlight \
            -ov \
            -format UDZO \
            "./dist/build/orgnote-macos-arm64-${{ inputs.version }}.dmg"

          rm -rf "$STAGING"
          echo "DMG created: orgnote-macos-arm64-${{ inputs.version }}.dmg"

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: orgnote-macos-arm64-${{ inputs.version }}.dmg
          path: ./dist/build/orgnote-macos-arm64-${{ inputs.version }}.dmg
          retention-days: ${{ inputs.prerelease && 7 || 30 }}
