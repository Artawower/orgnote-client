on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APK
    needs: [get-version]
    uses: ./.github/workflows/build-android.yaml
    with:
      environment: deploy
      version: ${{ github.event.release.tag_name || needs.get-version.outputs.version }}
      prerelease: false

  build-electron:
    name: Build Electron macOS
    needs: [get-version]
    uses: ./.github/workflows/build-electron.yaml
    with:
      environment: deploy
      version: ${{ github.event.release.tag_name || needs.get-version.outputs.version }}
      prerelease: false

  build-electron-linux:
    name: Build Electron Linux
    needs: [get-version]
    uses: ./.github/workflows/build-electron-linux.yaml
    with:
      environment: deploy
      version: ${{ github.event.release.tag_name || needs.get-version.outputs.version }}
      prerelease: false

  upload-release-asset:
    name: Upload Release Asset
    needs: [build-android, build-electron, build-electron-linux, get-version]
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: orgnote-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.apk
          path: ./dist/release

      - name: Download Electron macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: orgnote-macos-${{ github.event.release.tag_name || needs.get-version.outputs.version }}
          path: ./dist/release/macos

      - name: Download Electron Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: orgnote-linux-${{ github.event.release.tag_name || needs.get-version.outputs.version }}
          path: ./dist/release/linux

      - name: Upload APK Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name || needs.get-version.outputs.version }}"
          gh release upload "$VERSION" \
            ./dist/release/orgnote-${VERSION}.apk --clobber
        shell: bash

      - name: Upload Electron macOS Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name || needs.get-version.outputs.version }}"
          for FILE in ./dist/release/macos/*; do
            [ -f "$FILE" ] || continue
            echo "Uploading $(basename "$FILE")"
            gh release upload "$VERSION" "$FILE" --clobber
          done
        shell: bash

      - name: Upload Electron Linux Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name || needs.get-version.outputs.version }}"
          for FILE in ./dist/release/linux/*; do
            [ -f "$FILE" ] || continue
            echo "Uploading $(basename "$FILE")"
            gh release upload "$VERSION" "$FILE" --clobber
          done
        shell: bash
