on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APK
    needs: [get-version]
    uses: ./.github/workflows/build-android.yaml
    with:
      environment: deploy
      version: ${{ github.event.release.tag_name || needs.get-version.outputs.version }}
      prerelease: false

  build-electron:
    name: Build Electron macOS
    needs: [get-version]
    uses: ./.github/workflows/build-electron.yaml
    with:
      environment: deploy
      version: ${{ github.event.release.tag_name || needs.get-version.outputs.version }}
      prerelease: false

  upload-release-asset:
    name: Upload Release Asset
    needs: [build-android, build-electron, get-version]
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: orgnote-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.apk
          path: ./dist/release

      - name: Download Electron artifact
        uses: actions/download-artifact@v4
        with:
          name: orgnote-macos-arm64-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.dmg
          path: ./dist/release

      - name: Upload APK Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/release/orgnote-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.apk
          asset_name: orgnote-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.apk
          asset_content_type: application/octet-stream

      - name: Upload Electron Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/release/orgnote-macos-arm64-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.dmg
          asset_name: orgnote-macos-arm64-${{ github.event.release.tag_name || needs.get-version.outputs.version }}.dmg
          asset_content_type: application/x-apple-diskimage
