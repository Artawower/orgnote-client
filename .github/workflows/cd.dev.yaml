name: CD orgnote client (dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  ci-checks:
    uses: ./.github/workflows/ci-checks.yaml

  check-version-changed:
    name: Check version changed
    runs-on: ubuntu-latest
    needs: [ci-checks]
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: check
        run: |
          PREV_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
          CURR_VERSION=$(jq -r '.version' package.json)
          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREV_VERSION → $CURR_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

  build-android:
    name: Build Android APK
    needs: [check-version-changed]
    if: needs.check-version-changed.outputs.changed == 'true'
    uses: ./.github/workflows/build-android.yaml
    with:
      environment: dev
      version: ${{ needs.check-version-changed.outputs.version }}-dev
      prerelease: true
    secrets: inherit

  docker-deploy:
    name: Docker Build and Deploy
    needs: [ci-checks]
    uses: ./.github/workflows/cd.base.yaml
    with:
      environment: dev
      image_tag: dev
      trigger_event: trigger-deploy-dev
    secrets: inherit

  create-prerelease:
    name: Create Pre-release
    needs: [build-android, check-version-changed]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: orgnote-${{ needs.check-version-changed.outputs.version }}-dev.apk
          path: ./apk

      - name: Generate release body
        id: release-body
        run: |
          VERSION="${{ needs.check-version-changed.outputs.version }}"
          CURRENT_TAG="v${VERSION}-dev"
          COMMIT_FULL="${{ github.sha }}"

          {
            echo "Dev Build v${VERSION} Pre-release"
            echo ""

            PREV_DEV_TAG="$(git tag -l 'v*-dev' | grep -v "^${CURRENT_TAG}$" | sort -V -r | head -n1)"

            if [ -n "${PREV_DEV_TAG}" ]; then
              echo "### Changes since ${PREV_DEV_TAG}"
              echo ""
              CHANGES="$(git log --no-merges --pretty=format:'- %s' "${PREV_DEV_TAG}..HEAD")"
            else
              echo "### Recent changes"
              echo ""
              CHANGES="$(git log --no-merges --pretty=format:'- %s' -n 20 HEAD)"
            fi

            if [ -z "${CHANGES}" ]; then
              echo "- No commit messages found."
            else
              echo "${CHANGES}"
            fi

            echo ""
            echo "---"
            echo ""
            echo "- **Version:** ${VERSION}"
            echo "- **Branch:** dev"
            echo "- **Commit:** ${COMMIT_FULL}"
          } > release-body.md

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version-changed.outputs.version }}-dev
          name: "Dev Build v${{ needs.check-version-changed.outputs.version }}"
          body_path: release-body.md
          prerelease: true
          files: ./apk/orgnote-${{ needs.check-version-changed.outputs.version }}-dev.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old dev releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 5
          delete_tag_pattern: -dev
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
